  <g opacity=".18" stroke="#22D3EE" stroke-width="1"><path d="M720 0v320M800 0v320M880 0v320M960 0v320M1040 0v320M1120 0v320M1200 0v320"/><path d="M680 64h600M680 128h600M680 192h600M680 256h600"/></g>

name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check packages tests
      - run: pytest -q
      - run: python -m failurelens.cli demo
      - run: python -m failurelens.cli experiment --horizon 7
      - run: python -m failurelens.cli data-validate
      - run: python -m failurelens.cli benchmark --horizon 7
      - run: python -m pip check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t failurelens-ai .
      - run: docker compose config
